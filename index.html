<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sujoy's Study Notebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook library. Left index tree, right reading column. Stacks on phones. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --sunk:#eceff4; --fg:#1b2230; --muted:#5a6578; --line:#d6dbe4;
  --accent:#2f5d8a; --accent-bg:#e3ecf5; --ok:#2e7d5b;
  --t:#1b2230; --p:#3a4558; --b:#c9d0dc;
  --blue:#2f78c4; --blue-bg:#dbe9f7; --coral:#c9562e; --coral-bg:#f7e2d9; --gray-bg:#e6e9ee;
  --purple:#6b62c9; --purple-bg:#e8e6f8; --teal:#1c8a6c; --teal-bg:#d9f0e8;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --sunk:#222a35; --fg:#e4e8ef; --muted:#9aa6b8; --line:#2f3946;
  --accent:#8db8e3; --accent-bg:#1f3347; --ok:#6fcca3;
  --t:#e4e8ef; --p:#b7c1d1; --b:#3c4757;
  --blue:#6aa9e8; --blue-bg:#1d3349; --coral:#e8845e; --coral-bg:#3d261d; --gray-bg:#262e3a;
  --purple:#a39bf0; --purple-bg:#2a2747; --teal:#55c4a2; --teal-bg:#173a31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --sunk:#222a35; --fg:#e4e8ef; --muted:#9aa6b8; --line:#2f3946;
  --accent:#8db8e3; --accent-bg:#1f3347; --ok:#6fcca3;
  --t:#e4e8ef; --p:#b7c1d1; --b:#3c4757;
  --blue:#6aa9e8; --blue-bg:#1d3349; --coral:#e8845e; --coral-bg:#3d261d; --gray-bg:#262e3a;
  --purple:#a39bf0; --purple-bg:#2a2747; --teal:#55c4a2; --teal-bg:#173a31; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--accent)}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100%;padding-left:max(0px, env(safe-area-inset-left,0px));padding-right:max(0px, env(safe-area-inset-right,0px))}
nav.side{border-right:1px solid var(--line);background:var(--panel);padding-block:24px;padding-inline:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-size:20px;font-weight:650;margin:0 0 4px;text-wrap:balance}
.brand a{color:var(--fg);text-decoration:none}
.sub{font-size:13px;color:var(--muted);margin:0 0 20px}
.tree{list-style:none;margin:0;padding:0;font-size:14px}
.tree ul{list-style:none;margin:4px 0 8px;padding-left:14px;border-left:1px solid var(--line)}
.tree .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:600}
.tree a{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:5px;text-decoration:none;color:var(--fg)}
.tree a:hover{background:var(--sunk)}
.tree a.cur{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tree .soon{color:var(--muted);padding:4px 8px;display:block}
.chk{color:var(--ok);font-size:12px}
main{padding-block:32px 64px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:860px;margin:0 auto}
.crumb{font-size:13px;color:var(--muted);margin:0 0 8px}
.crumb a{color:var(--muted)}
h1{font-family:var(--display);font-weight:650;font-size:32px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
h2{font-family:var(--display);font-weight:650;font-size:22px;margin:36px 0 10px;text-wrap:balance}
.big{font-size:17px;line-height:1.7;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:14px 18px;margin:12px 0 8px;max-width:72ch}
.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;color:var(--muted);margin:10px 0 0}
.meta label{display:flex;gap:6px;align-items:center;cursor:pointer}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.libcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;text-decoration:none;color:var(--fg)}
.libcard:hover{border-color:var(--accent)}
.libcard .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.libcard .n{font-family:var(--display);font-size:19px;font-weight:650;margin:4px 0}
.libcard .d{font-size:14px;color:var(--muted);margin:0}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.addnote{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:14px 16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.tab{font-size:13px;padding:5px 11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px}
.card h3{font-family:var(--display);font-size:20px;font-weight:650;margin:0 0 8px}
.fig{overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto}
.sec{margin:18px 0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.txt{margin:4px 0;max-width:72ch}
.eq{font-family:var(--display);font-size:18px;line-height:1.9;background:var(--sunk);border-radius:6px;padding:12px 14px;margin:6px 0;text-align:center;overflow-x:auto}
.sym{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 14px;font-size:14px;line-height:1.6;margin:8px 0}
.sym b{font-family:var(--mono);font-weight:500;font-size:13px}
ol.st{margin:4px 0;padding-left:22px;max-width:72ch}
ol.st li{margin:2px 0}
.num{font-size:14px;line-height:1.75;background:var(--sunk);border-radius:6px;padding:12px 14px;margin:6px 0;font-variant-numeric:tabular-nums}
.say{margin:6px 0;padding:2px 0 2px 12px;border-left:3px solid var(--ok);max-width:72ch}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.row label{font-size:14px;color:var(--muted);min-width:130px}
.row input[type=range]{flex:1;min-width:140px}
.row .v{font-size:14px;font-weight:600;min-width:90px;font-variant-numeric:tabular-nums}
.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 18px}
.sheet .r{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sheet .r:last-child{border-bottom:0}
.sheet .r span:first-child{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sheet .e{font-family:var(--display);font-size:17px;overflow-x:auto}
.sheet .c{font-size:13px;color:var(--muted)}
.src{font-size:14px;color:var(--muted)}
.src li{margin:3px 0}
/* SVG vocabulary used by the figures */
svg .ts{font-family:var(--body);font-size:12px;fill:var(--muted)}
svg .th{font-family:var(--body);font-size:14px;font-weight:600;fill:var(--fg)}
svg .t{font-family:var(--body);font-size:14px;fill:var(--fg)}
svg .arr{stroke:var(--p);stroke-width:1.5;fill:none}
svg .c-blue rect,svg rect.c-blue{fill:var(--blue-bg);stroke:var(--blue)}
svg .c-gray rect,svg rect.c-gray{fill:var(--gray-bg);stroke:var(--p)}
svg .c-purple rect,svg rect.c-purple{fill:var(--purple-bg);stroke:var(--purple)}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  h1{font-size:26px}
  .sym{grid-template-columns:96px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="shell">
  <nav class="side" aria-label="Study library">
    <p class="brand"><a href="#">Study Notebook</a></p>
    <p class="sub">Sujoy's personal lessons, by subject</p>
    <ul class="tree" id="tree"></ul>
  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>

<script>
/* ============================================================
   LIBRARY: every subject lives here. To add a new subject later,
   add an entry to LIBRARY with its own groups and lessons.
   ============================================================ */
const a0=0.0381, Eg=1.519;
function fw(V0,a,L){let hi=Math.min(V0,a*Math.pow(Math.PI/L,2))-1e-9,lo=1e-9;const f=E=>Math.sqrt(E/a)*Math.tan(Math.sqrt(E/a)*L/2)-Math.sqrt((V0-E)/a);for(let i=0;i<80;i++){const m=(lo+hi)/2;if(f(m)>0)hi=m;else lo=m}return(lo+hi)/2}
const DEF='<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
const svg=(h,b)=>`<svg width="680" viewBox="0 0 680 ${h}" role="img">${DEF}${b}</svg>`;
const sl=(id,lab,mn,mx,st,v)=>`<div class="row"><label for="${id}">${lab}</label><input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${v}"><span class="v" id="${id}v"></span></div>`;
const EL=(x,y)=>`<circle cx="${x}" cy="${y}" r="7" fill="#378ADD" stroke="#0C447C"/>`;
const HO=(x,y)=>`<circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#D85A30" stroke-width="2"/>`;
const $=id=>document.getElementById(id);
const axes=(x,y)=>`<line x1="${x}" y1="${y}" x2="${x}" y2="${y-40}" stroke="var(--t)" stroke-width="1" marker-end="url(#ar)"/><line x1="${x}" y1="${y}" x2="${x+40}" y2="${y}" stroke="var(--t)" stroke-width="1" marker-end="url(#ar)"/><line x1="${x}" y1="${y}" x2="${x+24}" y2="${y-18}" stroke="var(--t)" stroke-width="1" marker-end="url(#ar)"/><text class="ts" x="${x-4}" y="${y-46}" text-anchor="middle">z</text><text class="ts" x="${x+46}" y="${y+4}">x</text><text class="ts" x="${x+28}" y="${y-22}">y</text>`;
const lobe=(cx,cy,dx,dy,rx,ry,rot,col)=>`<ellipse cx="${cx+dx}" cy="${cy+dy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx+dx} ${cy+dy})" fill="${col}" fill-opacity="0.35" stroke="${col}" stroke-width="1.2"/><ellipse cx="${cx-dx}" cy="${cy-dy}" rx="${rx}" ry="${ry}" transform="rotate(${rot} ${cx-dx} ${cy-dy})" fill="${col}" fill-opacity="0.35" stroke="${col}" stroke-width="1.2"/>`;
const ring=(cx,cy,rx,ry,dir,col)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${col}" stroke-width="4"/><path d="M${cx-rx*0.5} ${cy-ry*0.87-2} Q${cx} ${cy-ry-6} ${cx+rx*0.5} ${cy-ry*0.87-2}" fill="none" stroke="${col}" stroke-width="1.5" ${dir>0?'marker-end':'marker-start'}="url(#ar)"/>`;

/* ---------------- Chapter 1, Lesson 1 ---------------- */
const L1={
id:"thesis-ch1-l1", title:"Lesson 1: Bands, electrons, holes and confinement", short:"1. Bands, holes, confinement",
big:"The dot's photon energy is the GaAs band gap plus the energy it costs to squeeze an electron and a hole into a tiny box. How large that cost is depends on each carrier's effective mass.",
cards:[
{s:"1. Gap",t:"Two floors with no stairs: the band gap",
intu:"Electrons in a solid can't have any energy they like. They live on two floors. The lower floor (valence band) is completely full, so its electrons have no free seat to move into: no current, no light. The upper floor (conduction band) is empty. There are no stairs between the floors, so an electron must receive at least the floor height E_g in one go. A photon can deliver that in a single jump. Drag the slider: below the gap nothing happens. At or above it, one electron goes up and leaves an empty seat downstairs. That empty seat is the hole of card 3.",
eq:"E<sub>ph</sub> = hc / λ &nbsp;⟹&nbsp; E [eV] = 1239.84 / λ [nm]<br>absorbed only if &nbsp;E<sub>ph</sub> ≥ E<sub>g</sub>",
sym:[["E_ph","photon energy (eV)"],["h","Planck constant, 6.626 × 10⁻³⁴ J·s"],["c","speed of light, 2.998 × 10⁸ m/s"],["λ","wavelength in vacuum (nm)"],["hc","1239.84 eV·nm, the handy combined constant"],["E_g","band gap: height of the upper floor above the lower one"]],
how:["Planck: light comes in packets of energy E = hν, where ν is the frequency.","For light, ν = c/λ.","Substitute: E = hc/λ. Short wavelength means large energy.","To lift an electron across the gap in one jump, the packet must carry at least E_g."],
say:"795 nm is not the GaAs gap. The gap at 4 K is 816 nm. 795 nm is the gap plus confinement.",
num:"Bulk GaAs at 4 K: E<sub>g</sub> = 1.519 eV, so λ<sub>g</sub> = 1239.84 / 1.519 = <b>816 nm</b>.<br>Your dots: λ = 795 nm, so E = 1239.84 / 795 = <b>1.560 eV</b>.<br>Difference: <b>41 meV</b>, explained by cards 5 and 6.",
r(fig,ctl){ctl.innerHTML=sl("s","Light wavelength",700,900,1,795);const u=()=>{const l=+$("s").value,E=1239.84/l,ab=E>=Eg;$("sv").textContent=l+" nm";let d="";for(let x=160;x<=520;x+=30)if(!(ab&&x===340))d+=EL(x,203);
fig.innerHTML=svg(260,`<text class="ts" x="140" y="32">upper floor: conduction band (empty)</text><rect class="c-blue" x="140" y="40" width="400" height="46" rx="4" stroke-width="0.5"/><rect class="c-gray" x="140" y="180" width="400" height="46" rx="4" stroke-width="0.5"/><text class="ts" x="140" y="246">lower floor: valence band (full)</text><line x1="120" y1="90" x2="120" y2="176" stroke="var(--t)" marker-start="url(#ar)" marker-end="url(#ar)"/><text class="ts" x="40" y="138">E_g</text>${d}${ab?EL(340,63)+HO(340,203)+'<line x1="340" y1="194" x2="340" y2="74" stroke="#378ADD" stroke-dasharray="4 3" marker-end="url(#ar)"/>':""}<text class="th" x="610" y="138" text-anchor="middle">${E.toFixed(3)} eV</text><text class="ts" x="610" y="158" text-anchor="middle">${ab?"absorbed":"passes"}</text>`)};$("s").oninput=u;u()}},
{s:"2. Mass",t:"Ping-pong ball versus bowling ball: effective mass",
intu:"Give a ping-pong ball and a bowling ball the same push, so they get the same momentum. The ping-pong ball ends up with far more kinetic energy. Plot energy against momentum and the light ball's curve shoots up steeply while the heavy ball's curve stays flat. In a crystal we know energy against k for every band, so we read the mass off the shape the same way: near the band edge, a steep and narrow curve is light, a flat curve is heavy. The dotted orange line is one fixed k. Drag the mass: lighter mass, higher point on the same line.",
eq:"E(k) ≈ E<sub>edge</sub> + ħ²k² / 2m* &nbsp;&nbsp; 1/m* = (1/ħ²) × (curvature of E versus k)",
sym:[["E_edge","energy of the band edge"],["ħ","h/2π = 1.055 × 10⁻³⁴ J·s"],["k","crystal wavevector (nm⁻¹). ħk is the crystal momentum"],["m*","effective mass, as a multiple of m₀"],["m₀","free electron mass, 9.109 × 10⁻³¹ kg"],["ħ²/2m₀","0.0381 eV·nm²"]],
how:["A free particle has E = p²/2m. With p = ħk (de Broglie) this is E = ħ²k²/2m, a parabola in k. It comes from the Schrödinger equation with a plane wave e^(ikx).","In a crystal the electron is a Bloch wave e^(ikx)u(x), and its band E(k) is not a simple parabola.","Near its edge, though, the band has the same parabola shape. Only the number in the denominator differs.","So keep the free-particle formula and replace m by m*, chosen to match the real band. Larger curvature means smaller m*.","Valid only near the band edge. Far from it the band is not a parabola."],
say:"Near the band edge, one over the effective mass is proportional to the band curvature. Sharp curve, light carrier. Flat curve, heavy carrier. The electron's real mass does not change.",
num:"Same k = 0.5 nm⁻¹ for both:<br>electron (0.067 m₀): 0.0381 × 0.25 / 0.067 = <b>142 meV</b><br>heavy hole (0.35 m₀): 0.0381 × 0.25 / 0.35 = <b>27 meV</b><br>Tight-binding toy check: E = E₀ − 2t cos(ka) gives m* = ħ²/(2ta²). Strong hopping t means a light carrier.",
r(fig,ctl){ctl.innerHTML=sl("m","Effective mass m*/m₀",0.05,0.6,0.01,0.067);const u=()=>{const m=+$("m").value;$("mv").textContent=m.toFixed(3)+" m₀";const X=k=>340+k*220,Y=E=>220-E*450;
const p=mm=>{const km=Math.min(1,Math.sqrt(0.4*mm/a0));let d="";for(let k=-km;k<=km+1e-9;k+=km/40)d+=(d?"L":"M")+X(k).toFixed(1)+" "+Y(a0/mm*k*k).toFixed(1);return d};
const E5=a0/m*0.25,yE=Math.max(30,Y(E5));
fig.innerHTML=svg(250,`<line x1="110" y1="220" x2="575" y2="220" stroke="var(--t)" stroke-width="0.5" marker-end="url(#ar)"/><line x1="340" y1="228" x2="340" y2="24" stroke="var(--t)" stroke-width="0.5" marker-end="url(#ar)"/><text class="ts" x="580" y="224">k</text><text class="ts" x="348" y="32">E</text><path d="${p(0.35)}" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 4"/><path d="${p(m)}" fill="none" stroke="#378ADD" stroke-width="2.5"/><line x1="450" y1="220" x2="450" y2="30" stroke="#EF9F27" stroke-width="1" stroke-dasharray="3 3"/><circle cx="450" cy="${yE}" r="5" fill="#EF9F27"/><text class="ts" x="460" y="${yE+4}">${(E5*1000).toFixed(0)} meV</text><text class="ts" x="455" y="238">k = 0.5 nm⁻¹</text><text class="ts" x="120" y="242">dashed: heavy hole 0.35 m₀</text>`)};$("m").oninput=u;u()}},
{s:"3. Hole",t:"A bubble in water: the hole",
intu:"In a full band every electron sits in a seat and nothing can move. Take one electron out. A neighbor slides into the empty seat, then the next neighbor into the new empty seat, and so on. The electrons shuffle one way and the empty seat travels the other way, like a bubble rising while the water sinks. Following one empty seat is much easier than following 10²³ electrons, so we treat it as a particle: the hole. It is a missing negative charge, so it acts as a positive charge. Press the button to watch it move.",
eq:"q<sub>h</sub> = +e &nbsp;&nbsp; k<sub>h</sub> = −k<sub>e</sub> &nbsp;&nbsp; s<sub>h</sub> = −s<sub>e</sub> &nbsp;&nbsp; m<sub>h</sub>* = −m<sub>v</sub>* &gt; 0",
sym:[["q_h","hole charge, +e = +1.602 × 10⁻¹⁹ C"],["k_e, s_e","wavevector and spin of the missing electron"],["k_h, s_h","wavevector and spin of the hole"],["m_v*","curvature mass of the valence band, negative because the band curves downward"],["m_h*","hole mass, positive"]],
how:["A full band adds up to zero: total k and total spin are zero, because every k has a partner −k and every spin up has a spin down.","Remove one electron with charge −e, wavevector k_e and spin s_e.","What remains is zero minus that electron: charge +e, wavevector −k_e, spin −s_e.","The valence band curves downward, so its curvature mass is negative. Flipping the sign gives the hole a positive mass."],
say:"A hole is a quasiparticle that describes a missing electron in the valence band. It is not a positron. When the thesis writes ⇑ or ⇓, that is the hole spin.",
num:"Rule for Lessons 2 to 5: ⇑ and ⇓ are <b>hole</b> spins, opposite to the missing electron.<br>The hole mass used for your dots is the heavy-hole mass along z, about <b>0.35 m₀</b>.",
r(fig,ctl){let p=340,n=0;ctl.innerHTML='<div class="row"><button id="mb">Let a neighbor slide into the empty seat</button></div>';const u=()=>{let d="";for(let x=160;x<=520;x+=30)if(x!==p)d+=EL(x,150);
fig.innerHTML=svg(230,`<rect class="c-gray" x="140" y="125" width="400" height="50" rx="4" stroke-width="0.5"/><text class="ts" x="140" y="200">full band with one missing electron</text>${d}${HO(p,150)}<text class="ts" x="${p}" y="154" text-anchor="middle">+</text>${n?`<text class="ts" x="${p-20}" y="100" text-anchor="end">electron slid left ←</text><text class="ts" x="${p+14}" y="100">→ hole moved right</text>`:""}`)};
$("mb").onclick=()=>{p=p>=490?340:p+30;n=1;u()};u()}},
{s:"4. Vertical",t:"An elevator, not an escalator: vertical transitions",
intu:"A photon at 795 nm carries plenty of energy (1.56 eV) but almost no momentum. So it works like an elevator: it lifts the electron straight up without moving it sideways in k. The orange arrows are always vertical. Raise the photon energy and the arrows move outward to larger k, because the extra energy goes into the motion of the electron and hole. Below the gap no vertical arrow fits between the curves.",
eq:"ħω = E<sub>c</sub>(k) − E<sub>v</sub>(k) = E<sub>g</sub> + ħ²k²/2m<sub>e</sub>* + ħ²k²/2m<sub>h</sub>* = E<sub>g</sub> + ħ²k²/2μ<br>1/μ = 1/m<sub>e</sub>* + 1/m<sub>h</sub>*",
sym:[["ħω","photon energy (ω = 2πν)"],["E_c(k)","conduction band: E_g + ħ²k²/2m_e*"],["E_v(k)","valence band: −ħ²k²/2m_h*"],["μ","reduced mass of the electron and hole pair"],["q","photon wavevector inside GaAs, 2πn/λ"],["π/a","Brillouin zone edge, a = 0.565 nm"]],
how:["Energy is conserved: photon energy equals final minus starting energy of the electron.","Momentum is conserved: k_final = k_start + q. Since q is tiny, k_final ≈ k_start. The arrow is vertical.","Subtract the two parabolas at the same k. The valence one has a minus sign, so the two kinetic terms add.","Combine the two masses into one reduced mass μ."],
say:"The photon's momentum is tiny compared with the electron's crystal momentum, about 0.5 % of the zone. It is not zero, just negligible.",
num:"Photon wavevector in GaAs (n ≈ 3.6): q = 2π × 3.6 / 795 nm ≈ <b>0.028 nm⁻¹</b>. Zone edge π/a = <b>5.6 nm⁻¹</b>. Ratio about <b>0.5 %</b>.<br>Electron and heavy hole: 1/μ = 1/0.067 + 1/0.35, so μ ≈ <b>0.056 m₀</b>.",

{s:"5. Box",t:"A guitar string: confinement",
intu:"A guitar string is fixed at both ends, so only waves that fit exactly can exist. A shorter string forces a shorter wavelength, a larger k and a higher note. The dot does the same to the electron and hole along z. Combine with card 2: a larger k costs more energy, and a lighter carrier pays more for the same k. So confinement energy grows when the box shrinks and when the mass drops. Because k enters squared, halving the dot height makes the energy four times larger.",
eq:"L = nλ/2 &nbsp;⟹&nbsp; k<sub>n</sub> = nπ/L &nbsp;⟹&nbsp; E<sub>n</sub> = ħ²k<sub>n</sub>²/2m* = ħ²π²n²/(2m*L²)",
sym:[["L","dot height along z (nm)"],["n","1, 2, 3 … number of half wavelengths that fit"],["λ","wavelength of the carrier's standing wave"],["k_n","allowed wavevector, nπ/L"],["E_n","confinement energy above the band edge"],["m*","effective mass (card 2)"]],
how:["The wave must be zero at both walls, so a whole number of half wavelengths fits: L = nλ/2.","With k = 2π/λ this gives k = nπ/L. Only these k are allowed.","Put that k into the band-edge parabola: E = ħ²k²/2m*.","Result: E ∝ n²/(m*L²). Ground state is n = 1."],
say:"Confinement energy depends on dot size and carrier mass together, E ∝ 1/(m*L²).",

{s:"6. Photon",t:"Paying for the photon: gap + squeeze − discount",
intu:"When the electron falls into the hole, the photon carries away the full energy of the pair. That bill has three parts: crossing the gap, squeezing the electron into the dot, and squeezing the hole into the dot. There is a small discount because they attract (Coulomb). The AlGaAs walls are not infinitely high, so the wave spills into them, feels a slightly bigger box, and pays less than in card 5.",
eq:"E<sub>photon</sub> = E<sub>g</sub> + E<sub>e</sub> + E<sub>h</sub> − E<sub>X</sub><br>finite well: &nbsp;k tan(kL/2) = κ, &nbsp; k = √(2m*E)/ħ, &nbsp; κ = √(2m*(V₀ − E))/ħ",
sym:[["E_g","GaAs gap, 1.519 eV at 4 K"],["E_e","electron confinement energy (finite walls)"],["E_h","hole confinement energy, heavy hole"],["E_X","Coulomb binding, a few meV (Lesson 3)"],["V₀","wall height: about 0.243 eV (electrons) and 0.131 eV (holes) for Al₀.₃Ga₀.₇As, assumed"]],
how:["Energy conservation: the photon takes exactly the pair's energy.","That energy is the gap plus each carrier's confinement energy.","Subtract the Coulomb binding, because attraction lowers the energy.","Inside the dot the wave is cos(kz), in the barrier it decays as e^(−κ|z|). Matching both at the wall gives k tan(kL/2) = κ, solved numerically."],
say:"Finite AlGaAs walls let the wave leak out, so the real confinement energy is lower than the infinite-box value.",
num:"Your dots: 1.560 eV, so E<sub>e</sub> + E<sub>h</sub> − E<sub>X</sub> ≈ <b>41 meV</b>.<br>The slider is a 1D finite well with assumed Al₀.₃Ga₀.₇As walls, ignoring E<sub>X</sub> and lateral confinement. It shows the trend, not your actual dots.",
r(fig,ctl){ctl.innerHTML=sl("L","Dot height L",3,15,0.5,10);const u=()=>{const L=+$("L").value;$("Lv").textContent=L+" nm";const Ee=fw(0.243,a0/0.067,L),Eh=fw(0.131,a0/0.35,L),Ep=Eg+Ee+Eh;

],
summary:"In GaAs, near the band edges, electrons and holes behave like free particles with effective masses set by the band curvature. A photon only lifts an electron straight up in k, because its momentum is tiny. In the dot, both carriers are squeezed along z, which costs an energy proportional to one over m* L². So the dot emits above the GaAs gap, at 795 nm instead of 816 nm. Because the heavy hole has the larger mass, it is shifted least and becomes the lowest hole state.",

big:"The valence band is built from p orbitals that point along x, y and z. Spin–orbit coupling combines them with spin into heavy holes (only X and Y, so in-plane light) and light holes (which contain Z). A flat dot makes the heavy hole the ground state, and a little light-hole mixing gives the weak z-polarized transitions in Fig. 1.1.",
cards:[
{s:"1. p orbitals",t:"Three dumbbells: the p orbitals X, Y, Z",
intu:"The conduction band is s-like (round) and the valence band is p-like. A p orbital looks like a dumbbell, and there are three, pointing along x, y and z: X, Y and Z. Each is a standing wave that points along an axis but does not rotate. Combine X and Y with a quarter-period delay, written X + iY, and the two dumbbells take turns: the shape becomes a ring in the xy plane rotating around z. A rotating ring carries angular momentum around z, +1 for X + iY and −1 for X − iY. Z points along z itself, so it does not rotate around z: angular momentum 0.",
eq:"l = 1, &nbsp; m<sub>l</sub> = +1, 0, −1<br>|m<sub>l</sub> = ±1⟩ = ∓ (X ± iY)/√2 &nbsp;&nbsp; |m<sub>l</sub> = 0⟩ = Z",
sym:[["X, Y, Z","p-like orbitals pointing along x, y, z"],["l","orbital angular momentum number. 0 for s, 1 for p"],["m_l","projection on z, in units of ħ"],["i","'X + iY' means Y lags X by a quarter period, making a rotating ring"],["z","growth axis, normal to your membrane"]],
how:["Valence band states near k = 0 have the symmetry of atomic p orbitals, so they behave like X, Y, Z.","X, Y and Z each point along an axis, but none has a definite angular momentum around z.","X ± iY rotate around z, so they carry m_l = ±1. Z does not, so m_l = 0.","1/√2 keeps the state normalized. The sign is a convention."],
say:"The valence band near k = 0 is p-like. X ± iY is a ring in the plane with m_l = ±1. Z points along the growth axis with m_l = 0.",
num:"Conduction band: l = 0, one orbital. Valence band: l = 1, three orbitals.<br>With spin that makes <b>6 valence states</b> at k = 0. Card 2 sorts them.",

{s:"2. Spin–orbit",t:"Spin meets orbit: J = 3/2 and J = 1/2",
intu:"Each of the 3 p orbitals holds spin up or spin down: 6 states. Without extra effects they have the same energy at k = 0. But an electron moving around the nucleus sees, in its own frame, the nucleus moving around it. A moving charge makes a magnetic field, and the spin is a tiny magnet. So the energy depends on whether spin is lined up with the orbital motion or against it. Lined up gives J = 3/2 (4 states), opposed gives J = 1/2 (2 states). In GaAs they are 0.34 eV apart. Drag the slider to switch the coupling on.",
eq:"J = L + S &nbsp;&nbsp; H<sub>SO</sub> = λ L·S &nbsp;&nbsp; L·S = ½[j(j+1) − l(l+1) − s(s+1)]<br>j = 3/2: L·S = +½ &nbsp;&nbsp; j = 1/2: L·S = −1 &nbsp;⟹&nbsp; Δ<sub>SO</sub> = (3/2)λ",
sym:[["L","orbital angular momentum, l = 1"],["S","spin, s = 1/2"],["J","total angular momentum, j = 3/2 or 1/2"],["m_j","projection of J on z"],["λ","spin–orbit strength (energy)"],["Δ_SO","splitting between J = 3/2 and J = 1/2"]],
how:["Angular momenta add: j = l + s = 3/2 or l − s = 1/2.","Count: j = 3/2 has 2j + 1 = 4 states, j = 1/2 has 2. Total 6, matching 3 orbitals × 2 spins.","From J² = L² + 2L·S + S²: L·S = ½[j(j+1) − l(l+1) − s(s+1)].","j = 3/2 gives +½, j = 1/2 gives −1. Difference (3/2)λ.","J = 3/2 is the top of the valence band. J = 1/2 is the split-off band, Δ_SO lower, ignored for your dots."],
say:"Spin–orbit coupling splits the six p-like states into J = 3/2 (four states, top of the band) and J = 1/2 (two states, about 0.34 eV lower in GaAs). Heavy and light holes both belong to J = 3/2.",

{s:"3. HH and LH",t:"What heavy and light holes look like",
intu:"Build the four J = 3/2 states from rings (m_l = ±1), Z (m_l = 0) and spin (m_s = ±½). To reach m_j = +3/2 you need the most of everything: ring +1 and spin +½. Only one way, so the state is a pure ring with spin up and contains no Z. That is the heavy hole. To reach m_j = +1/2 there are two ways: ring +1 with spin −½, or Z with spin +½. The state mixes both, and two thirds of it is Z. That is the light hole. Click each state.",
eq:"HH: |3/2, +3/2⟩ = −(1/√2)(X + iY)↑ &nbsp;&nbsp; |3/2, −3/2⟩ = (1/√2)(X − iY)↓<br>LH: |3/2, +1/2⟩ = −(1/√6)[(X + iY)↓ − 2Z↑] &nbsp;&nbsp; |3/2, −1/2⟩ = (1/√6)[(X − iY)↑ + 2Z↓]",

{s:"4. Why heavy, light",t:"Why 'heavy' and 'light': two curvatures",
intu:"At k = 0 all four J = 3/2 states have the same energy. Away from k = 0 they split into two bands with different curvature. From Lesson 1, curvature sets the effective mass. Along z, the m_j = ±3/2 band is flat, so it is heavy, and the m_j = ±1/2 band is curved, so it is light. The names come only from this curvature. In the plane the order reverses. Switch the direction and watch the curves swap. Your dot squeezes along z, so the z masses matter.",
eq:"along z: m<sub>hh</sub> = m<sub>0</sub>/(γ<sub>1</sub> − 2γ<sub>2</sub>) &nbsp;&nbsp; m<sub>lh</sub> = m<sub>0</sub>/(γ<sub>1</sub> + 2γ<sub>2</sub>)<br>in-plane: m<sub>hh</sub> = m<sub>0</sub>/(γ<sub>1</sub> + γ<sub>2</sub>) &nbsp;&nbsp; m<sub>lh</sub> = m<sub>0</sub>/(γ<sub>1</sub> − γ<sub>2</sub>)",
sym:[["γ₁, γ₂","Luttinger parameters: describe valence band curvature in a given crystal"],["m_hh, m_lh","heavy and light hole masses (positive)"],["m₀","free electron mass"],["along z","the squeezed direction, sets confinement energy"]],
how:["The four J = 3/2 states are degenerate at k = 0.","For k ≠ 0 the crystal mixes them depending on the direction of k. Luttinger described this with γ₁, γ₂, γ₃.","Along z, m_j = ±3/2 forms the flat band and m_j = ±1/2 the curved one.","In the plane the 'heavy' band is actually lighter. This is mass reversal."],
say:"Heavy and light describe the curvature of the two J = 3/2 bands along the growth axis z. Along z the heavy hole is heavier, which is why it is the ground state in a flat dot. It is not heavier in every direction.",
num:"GaAs: γ₁ = <b>6.98</b>, γ₂ = <b>2.06</b><br>along z: m<sub>hh</sub> = 1/(6.98 − 4.12) = <b>0.35 m₀</b>, m<sub>lh</sub> = 1/(6.98 + 4.12) = <b>0.090 m₀</b><br>in-plane: m<sub>hh</sub> = 1/(6.98 + 2.06) = <b>0.11 m₀</b>, m<sub>lh</sub> = 1/(6.98 − 2.06) = <b>0.20 m₀</b>",

eq:"Δ<sub>HH–LH</sub> = E<sub>lh</sub> − E<sub>hh</sub> = (ħ²π²/2L²)(1/m<sub>lh,z</sub> − 1/m<sub>hh,z</sub>) &nbsp; (infinite walls)",

how:["Confinement energy E = ħ²π²/(2m*L²) for each hole with its z mass.","Since m_hh,z > m_lh,z, the heavy hole has the smaller E: it is the lowest hole state.","Subtract to get the splitting. With finite walls both levels shift less.","In strained InGaAs dots strain adds to the splitting. Droplet-etched GaAs dots are nearly strain-free, so it comes mostly from confinement and shape."],
