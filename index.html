<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sujoy's Study Notebook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,650&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab-notebook library. Left index tree, reading area on the right.
   Lesson cards split into a sticky visual column and a scrolling explanation column. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --sunk:#eceff4; --fg:#1b2230; --muted:#5a6578; --line:#d6dbe4;
  --accent:#2f5d8a; --accent-bg:#e3ecf5; --ok:#2e7d5b; --bad:#b3412a;
  --t:#1b2230; --p:#3a4558; --b:#c9d0dc;
  --blue:#2f78c4; --blue-bg:#dbe9f7; --coral:#c9562e; --coral-bg:#f7e2d9; --gray-bg:#e6e9ee;
  --purple:#6b62c9; --purple-bg:#e8e6f8; --teal:#1c8a6c; --teal-bg:#d9f0e8;
  --display:"Literata", Georgia, "Times New Roman", serif;
  --body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --panel:#1a2029; --sunk:#222a35; --fg:#e4e8ef; --muted:#9aa6b8; --line:#2f3946;
  --accent:#8db8e3; --accent-bg:#1f3347; --ok:#6fcca3; --bad:#ec8a72;
  --t:#e4e8ef; --p:#b7c1d1; --b:#3c4757;
  --blue:#6aa9e8; --blue-bg:#1d3349; --coral:#e8845e; --coral-bg:#3d261d; --gray-bg:#262e3a;
  --purple:#a39bf0; --purple-bg:#2a2747; --teal:#55c4a2; --teal-bg:#173a31; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --panel:#1a2029; --sunk:#222a35; --fg:#e4e8ef; --muted:#9aa6b8; --line:#2f3946;
  --accent:#8db8e3; --accent-bg:#1f3347; --ok:#6fcca3; --bad:#ec8a72;
  --t:#e4e8ef; --p:#b7c1d1; --b:#3c4757;
  --blue:#6aa9e8; --blue-bg:#1d3349; --coral:#e8845e; --coral-bg:#3d261d; --gray-bg:#262e3a;
  --purple:#a39bf0; --purple-bg:#2a2747; --teal:#55c4a2; --teal-bg:#173a31; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
a{color:var(--accent)}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
select{font:inherit;font-size:14px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
nav.side{border-right:1px solid var(--line);background:var(--panel);padding-block:24px;padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:20px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--display);font-size:20px;font-weight:650;margin:0 0 4px}
.brand a{color:var(--fg);text-decoration:none}
.sub{font-size:13px;color:var(--muted);margin:0 0 20px}
.tree{list-style:none;margin:0;padding:0;font-size:14px}
.tree ul{list-style:none;margin:4px 0 8px;padding-left:12px;border-left:1px solid var(--line)}
.tree .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:600}
.tree .grp{display:block;padding:4px 8px;font-weight:600}
.tree a{display:flex;justify-content:space-between;gap:8px;padding:4px 8px;border-radius:5px;text-decoration:none;color:var(--fg)}
.tree a:hover{background:var(--sunk)}
.tree a.cur{background:var(--accent-bg);color:var(--accent);font-weight:600}
.tree .soon{color:var(--muted);padding:4px 8px;display:block}
.chk{color:var(--ok);font-size:12px}
main{padding-block:32px 64px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:880px;margin:0 auto}
body.wide .wrap{max-width:1240px}
.crumb{font-size:13px;color:var(--muted);margin:0 0 8px}
.crumb a{color:var(--muted)}
h1{font-family:var(--display);font-weight:650;font-size:32px;line-height:1.2;margin:0 0 12px;text-wrap:balance}
h2{font-family:var(--display);font-weight:650;font-size:22px;margin:36px 0 10px;text-wrap:balance}
h3.gt{font-family:var(--display);font-size:18px;margin:18px 0 2px}
.lead{color:var(--muted);max-width:72ch}
.big{font-size:17px;line-height:1.7;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:14px 18px;margin:12px 0 8px;max-width:80ch}
.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:14px;color:var(--muted);margin:10px 0 0}
.meta label{display:flex;gap:6px;align-items:center;cursor:pointer}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:12px 0}
.libcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;text-decoration:none;color:var(--fg)}
.libcard:hover{border-color:var(--accent)}
.libcard .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.libcard .n{font-family:var(--display);font-size:18px;font-weight:650;margin:4px 0;text-wrap:balance}
.libcard .d{font-size:14px;color:var(--muted);margin:0}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin-top:6px;overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--ok)}
.addnote{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:14px 16px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px;scroll-margin-top:12px}
.tab{font-size:13px;padding:5px 11px}
.card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px}
.vis{position:sticky;top:12px;min-width:0}
.exp{min-width:0;border-left:1px solid var(--line);padding-left:24px}
.card h3{font-family:var(--display);font-size:20px;font-weight:650;margin:0 0 8px;text-wrap:balance}
.fig{overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto}
.sec{margin:16px 0 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.exp .sec:first-child{margin-top:0}
.txt{margin:4px 0}
.eq{font-family:var(--display);font-size:17px;line-height:1.9;background:var(--sunk);border-radius:6px;padding:12px 14px;margin:6px 0;text-align:center;overflow-x:auto}
.sym{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:14px;line-height:1.6;margin:8px 0}
.sym b{font-family:var(--mono);font-weight:500;font-size:13px}
ol.st{margin:4px 0;padding-left:22px}
ol.st li{margin:3px 0}
.num{font-size:14px;line-height:1.75;background:var(--sunk);border-radius:6px;padding:12px 14px;margin:6px 0;font-variant-numeric:tabular-nums}
.say{margin:6px 0;padding:2px 0 2px 12px;border-left:3px solid var(--ok)}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.row label{font-size:14px;color:var(--muted);min-width:130px}
.row input[type=range]{flex:1;min-width:140px}
.row .v{font-size:14px;font-weight:600;min-width:90px;font-variant-numeric:tabular-nums}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}
.readout div{background:var(--sunk);border-radius:6px;padding:8px 10px}
.readout span{display:block;font-size:12px;color:var(--muted)}
.readout b{font-size:16px;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 18px}
.sheet .r{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sheet .r:last-child{border-bottom:0}
.sheet .r span:first-child{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sheet .e{font-family:var(--display);font-size:17px;overflow-x:auto}
.sheet .c{font-size:13px;color:var(--muted)}
.eq mjx-container[display="true"]{margin:6px 0 !important}
.eq .eqref{font-family:var(--body,inherit);font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
.eq .eqnote{font-family:var(--body,inherit);font-size:13px;color:var(--muted);text-align:left;margin:4px 0 0}
.sym b{white-space:nowrap;max-width:16em}
.sym b mjx-container{font-size:105% !important}
.sheet .e mjx-container[display="true"]{margin:2px 0 !important;text-align:left !important}
.eqbig{background:var(--sunk);border-radius:8px;padding:14px 10px;margin:0 0 10px;text-align:center;font-size:118%;line-height:1.4}
.eqbig mjx-container[display="true"]{margin:4px 0 !important}
.dnote{font-size:14px;line-height:1.65;background:var(--coral-bg);border-left:4px solid var(--coral);border-radius:6px;padding:12px 14px;margin:6px 0}
.dnote p{margin:0 0 8px}.dnote p:last-child{margin:0}.dnote ul{margin:4px 0 8px;padding-left:20px}
.dnote blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--ok);background:var(--panel);border-radius:4px}
code{font-family:var(--mono);font-size:.88em;background:var(--sunk);padding:0 4px;border-radius:3px;overflow-wrap:anywhere}
mjx-container[display="true"]{max-width:100%;overflow-x:auto;overflow-y:hidden;padding:2px 0}

.src{font-size:14px;color:var(--muted)}
.src li{margin:3px 0}
.quiz p{margin:6px 0}
.quiz .opts{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.quiz .opts button{text-align:left}
.quiz .fb{font-size:14px;line-height:1.6;min-height:44px}
.good{color:var(--ok);font-weight:600}
.badc{color:var(--bad);font-weight:600}
svg .ts{font-family:var(--body);font-size:12px;fill:var(--muted)}
svg .th{font-family:var(--body);font-size:14px;font-weight:600;fill:var(--fg)}
svg .t{font-family:var(--body);font-size:14px;fill:var(--fg)}
svg .arr{stroke:var(--p);stroke-width:1.5;fill:none}
svg .c-blue rect,svg rect.c-blue{fill:var(--blue-bg);stroke:var(--blue)}
svg .c-gray rect,svg rect.c-gray{fill:var(--gray-bg);stroke:var(--p)}
svg .c-purple rect,svg rect.c-purple{fill:var(--purple-bg);stroke:var(--purple)}
svg .c-teal rect,svg rect.c-teal{fill:var(--teal-bg);stroke:var(--teal)}
svg .c-coral rect,svg rect.c-coral{fill:var(--coral-bg);stroke:var(--coral)}
@media (max-width:1100px){
  .card{grid-template-columns:1fr}
  .vis{position:static}
  .exp{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  nav.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
  h1{font-size:26px}
  .card{padding:14px}
  .sym{grid-template-columns:auto minmax(0,1fr)}
  .sym b{max-width:11em;white-space:normal}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
pre.codebox{font-family:var(--mono);font-size:12.5px;line-height:1.55;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:pre}
pre.codebox code{background:none;padding:0;font-size:inherit}
</style>
</head>
